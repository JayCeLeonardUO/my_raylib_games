<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<title>GLB Mesh Inspector</title>
<style>
  body { margin: 0; padding: 0; background: #000; }
  canvas { border: 0; display: block; margin: 0 auto; }
  #upload-bar {
    padding: 8px 12px; background: #1a1a2e; border-bottom: 1px solid #333;
    display: flex; align-items: center; gap: 12px; font-family: sans-serif; font-size: 13px; color: #ccc;
  }
  #upload-bar input[type="file"] { color: #aaa; }
  #upload-bar .status { color: #6a6; font-family: monospace; font-size: 12px; }
</style>
</head>
<body>
<div id="upload-bar">
  <span>GLB Mesh Inspector</span>
  <input type="file" id="glb-input" accept=".glb">
  <span class="status" id="upload-status"></span>
</div>
<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
<script>
document.getElementById('glb-input').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var statusEl = document.getElementById('upload-status');
    statusEl.textContent = 'Reading ' + file.name + '...';

    var reader = new FileReader();
    reader.onload = function(ev) {
        var data = new Uint8Array(ev.target.result);
        window.__GLB_UPLOAD_BYTES = data;
        statusEl.textContent = file.name + ' (' + (data.length/1024).toFixed(1) + ' KB) - loading...';

        if (typeof Module._js_upload_glb === 'function') {
            Module._js_upload_glb();
            statusEl.textContent = file.name + ' loaded';
        } else {
            statusEl.textContent = 'WASM not ready';
        }
    };
    reader.readAsArrayBuffer(file);
});
</script>
{{{ SCRIPT }}}
</body>
</html>
